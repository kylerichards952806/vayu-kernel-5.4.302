name: Sync Ducky's upstream

# Pulls new commits from DUCKS-QCM-5-4/android_kernel_xiaomi_sm8150 into this
# branch on a schedule, because this tree is meant to track his work with only
# a few patches on top.
#
# When one of this fork's patches has been overtaken by his work, his version
# wins: the conflicted paths are taken from his tree, the reversal is recorded
# as a trailer on the merge commit, and the release notes report it. Stopping
# for a hand resolution instead is what let the branch sit four commits behind
# while a conflicting battery patch blocked every sync.
#
# A successful push then triggers the build workflow like any other commit.

on:
  schedule:
    # Daily, 03:17 UTC. Off the hour so it does not queue with everyone else's.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what is new, do not merge or push'
        type: boolean
        default: false

# actions: write so the build can be started explicitly. A push made with the
# workflow's own GITHUB_TOKEN does not trigger other workflows, so the build
# would never run from this job otherwise.
permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_REPO: DUCKS-QCM-5-4/android_kernel_xiaomi_sm8150
      UPSTREAM_BRANCH: MI_SM8150_5.4
      BRANCH: MI_SM8150_5.4

    steps:
      - name: Check out the branch with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name  "kyler084"
          git config user.email "kyler084@murena.io"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          echo "upstream tip: $(git rev-parse --short upstream/${UPSTREAM_BRANCH})"

      - name: Report what is new
        run: |
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "already contains upstream; nothing to do"
            echo "NEW=0" >> "$GITHUB_ENV"
            exit 0
          fi
          n=$(git rev-list --count HEAD.."upstream/${UPSTREAM_BRANCH}")
          echo "upstream is $n commit(s) ahead"
          echo "NEW=$n" >> "$GITHUB_ENV"
          {
            echo "### Upstream commits in this sync"
            echo
            git log --no-merges --format='- %s (%h)' HEAD.."upstream/${UPSTREAM_BRANCH}" | head -60
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream, resolving conflicts in Ducky's favour
        if: env.NEW != '0' && inputs.dry_run != true
        run: |
          set -eu
          # His tree is what this branch tracks, so a conflict means a patch of
          # ours has been overtaken: he changed the same lines for a reason.
          # Keeping ours would quietly undo his fix, and stopping for a hand
          # resolution is what previously left the branch four commits behind
          # (a battery patch conflicted with his power-supply work and every
          # sync failed on it). So the conflicted paths are taken from his tree,
          # the reversal is written into the merge commit, and the build runs.
          rm -f superseded.txt
          if git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
            echo 'merged cleanly'
          else
            paths=$(git diff --name-only --diff-filter=U)
            if [ -z "$paths" ]; then
              echo '::error::merge failed with no conflicted paths to resolve'
              git merge --abort || true
              exit 1
            fi
            echo 'conflicts (his version wins):'
            printf '%s\n' "$paths" | while IFS= read -r p; do
              [ -n "$p" ] || continue
              if git cat-file -e "upstream/${UPSTREAM_BRANCH}:$p" 2>/dev/null; then
                git checkout "upstream/${UPSTREAM_BRANCH}" -- "$p"
                git add -- "$p"
              else
                # He deleted the file, so the deletion is his answer.
                git rm -q -f -- "$p" || true
              fi
              # Which of our commits last had a say in this path, so the notes
              # can name the change that was reversed rather than just a file.
              ours=$(git log -1 --format='%h %s' HEAD -- "$p" | cut -c1-72)
              printf 'Superseded-by-upstream: %s (%s)\n' "$p" "$ours" >> superseded.txt
              echo "  $p"
            done
          fi

          # One message for both cases, so the release notes can read the
          # trailers off the merge commit no matter how it went.
          {
            echo "Merge Ducky's upstream MI_SM8150_5.4"
            if [ -s superseded.txt ]; then
              echo
              echo "Conflicts were resolved in Ducky's favour: for every file below"
              echo "this branch carries his version, and the change this fork had"
              echo "made to it is reversed until it is re-applied on top of his work."
              echo
              cat superseded.txt
            fi
          } > merge-msg.txt
          git commit -F merge-msg.txt
          rm -f merge-msg.txt
          git log -1 --format='%h %s'

          if [ -s superseded.txt ]; then
            {
              echo '### Conflict resolution: Ducky'"'"'s version kept'
              echo
              sed 's/^Superseded-by-upstream: /- /' superseded.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The build refuses to run on a branch that does not contain his tip,
          # so prove the merge really put it there before pushing anything.
          git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD \
            || { echo '::error::merge did not bring in the upstream tip'; exit 1; }

      - name: Push
        if: env.NEW != '0' && inputs.dry_run != true
        run: |
          git push origin "HEAD:${BRANCH}"

      # GitHub does not start a workflow for a push made with GITHUB_TOKEN, so
      # ask for the build directly. It is the same build a push would start.
      - name: Start the build
        if: env.NEW != '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-kernel.yml --ref "${BRANCH}"
          sleep 5
          gh run list --workflow build-kernel.yml --limit 1
